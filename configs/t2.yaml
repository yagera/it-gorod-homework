seed: 42
paths:
  train: data/raw/task2/internship_train.parquet
  test: data/raw/task2/internship_test.parquet
  sample: data/raw/task2/sample_submission.csv
  processed_dir: data/processed
  output: outputs/task-2.csv
  smoke_output: outputs/task-2.smoke.csv
read: {batch_size: 500, max_chars: 5000}
smoke: {n_train_rows: 5000}
tfidf: {max_features: 30000, ngram_range: [1, 2], sublinear_tf: true}
logreg: {C: 4.0, max_iter: 1000, class_weight: balanced}
# validation: схемы main/control зафиксированы (DECISIONS.md, запись 13); параметры experiment-раннера
# (C, class_weight, char-признаки) заданы в src/itgorod/t2_experiment.py; секции tfidf/logreg выше
# для smoke (tfidf.max_features используется и раннером)
